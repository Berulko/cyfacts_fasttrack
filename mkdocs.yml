site_name: cyfacts_fasttrack
site_description: Свод практики фаст-трека гражданства Кипра по чатам @cyfasttrack и @cylaw — с опорой на источники
site_url: https://berulko.github.io/cyfacts_fasttrack/
repo_url: https://github.com/Berulko/cyfacts_fasttrack
edit_uri: ""
exclude_docs: |
  _generated/
copyright: Содержимое — CC BY-SA 4.0 · код — MIT · не юридическая консультация
theme:
  name: material
  language: ru
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Светлая тема
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - toc:
      permalink: true
extra_css:
  - stylesheets/cy.css
extra_javascript:
  - javascripts/stale.js
  - javascripts/open-anchor.js
plugins:
  - search:
      lang: ru
